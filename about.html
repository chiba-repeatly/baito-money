<body><header class="site-header"><div class="wrap brand"><a href="./">バイトマネー</a></div></header><main class="wrap"><section class="info"><h1>このサイトについて</h1><p>バイトマネーは、アルバイトの「今月いくら稼げる？」を素早く確認するための無料Webツールです。</p><h2>できること</h2><p>時給、出退勤時刻、休憩時間、勤務日数から日給と月収の目安を計算できます。目標月収との差額や必要勤務時間、任意で深夜割増の概算も確認できます。</p><h2>計算結果について</h2><p>時間外・休日割増、各種手当、税金などすべての給与条件を再現するものではありません。結果は目安として利用してください。</p><p><a href="./">バイト代を計算する</a></p></section></main></body></html>
